<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - La Mimbre Restaurante</title>

    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <!-- Estilos: inicio-styles.css (navbar unificado) y menu-styles.css (carta de platos) -->
    <link rel="stylesheet" href="inicio-styles.css">
    <link rel="stylesheet" href="menu-styles.css">

    <!-- Scripts de funcionalidad -->
    <script src="inicio-main.js" defer></script>
    <script src="menu-main.js" defer></script>
</head>

<body>

    <!-- ==================== NAVEGACIÓN UNIFICADA ==================== -->
    <header class="cabecera">
        <nav class="nav">
            <a href="index.html" class="logo-mini">LA MIMBRE</a>

            <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
                ☰
            </button>

            <div class="nav-links" id="navLinks">
                <a href="index.html">INICIO</a>
                <a href="menu.html" class="active">MENÚ</a>
                <a href="nosotros.html">NOSOTROS</a>
                <a href="reserva.html">RESERVA</a>
                <a href="contacto.html">CONTACTO</a>
            </div>
        </nav>
    </header>

    <main class="menu-container">

        <!-- Decoración Hojas Oliva Superior -->
        <div class="leaf-bg leaf-top-right"></div>
        <div class="leaf-bg leaf-mid-left"></div>

        <!-- CONTENEDOR EN REJILLA (SECCIONES LADO A LADO EN PORTÁTIL) -->
       <div class="menu-grid">

            <!-- SECCIÓN: ENTRANTES -->
            <section class="menu-section">
                <div class="section-title">
                    <h1>MENÚ</h1>
                    <h2>Entrantes</h2>
                </div>

                <div class="dish-list" id="entrantes">
                    <!-- Los platos se cargan desde data.json con menu-main.js -->
                </div>
            </section>

            <!-- SECCIÓN: PRINCIPAL -->
            <section class="menu-section">
                <div class="section-title">
                   
                    <h2>Principal</h2>
                </div>

                <div class="dish-list" id="principal">
                    <!-- Los platos se cargan desde data.json con menu-main.js -->
                </div>
            </section>
            <!-- SECCIÓN: POSTRES -->
            <section class="menu-section">
                <div class="section-title">
                    
                    <h2>Postres</h2>
                </div>

                <div class="dish-list" id="postres">
                    <!-- Los platos se cargan desde data.json con menu-main.js -->
                </div>
            </section>

            <!-- SECCIÓN: BEBIDAS -->
            <section class="menu-section">
                <div class="section-title">
                    
                    <h2>Bebidas</h2>
                </div>

                <div class="dish-list" id="bebidas">
                    <!-- Los platos se cargan desde data.json con menu-main.js -->
                </div>
            </section>

        </div> <!-- /menu-grid -->
    </main>

</body>

</html>
