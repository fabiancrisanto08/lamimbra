<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - La Mimbre Restaurante</title>
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- Estilos CSS -->
    <link rel="stylesheet" href="inicio-styles.css">
    <link rel="stylesheet" href="menu-styles.css">
    <!--Estilos boton sonido-->
    <link rel="stylesheet" href="botonAudioGlobal.css">

    <!-- Librería GSAP CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- Scripts unificados -->
    <script src="menu-main.js" defer></script>
    <script src="theme-lang.js" defer></script>
    <script src="audioGlobal.js"></script>
</head>

<body>
    <audio id="mi-audio" src="audio/audio1.mp3" preload="auto"></audio>
    <button id="audio-btn">🔊</button>

<!-- ==================== NAVEGACIÓN UNIFICADA ==================== -->
<header class="cabecera">
    <nav class="nav">
        <a href="index.html" class="logo-mini">LA MIMBRE</a>

        <div class="nav-controls">
            <button id="themeToggle" class="control-btn" aria-label="Cambiar tema">🌙</button>
            <div class="lang-selector">
                <button id="langEs" class="lang-btn active">ES</button>
                <span>|</span>
                <button id="langEn" class="lang-btn">EN</button>
            </div>
        </div>

        <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
            ☰
        </button>

        <div class="nav-links" id="navLinks">
            <a href="index.html" data-i18n="nav.home">INICIO</a>
            <a href="menu.html" class="active" data-i18n="nav.menu">MENÚ</a>
            <a href="nosotros.html" data-i18n="nav.about">NOSOTROS</a>
            <a href="reserva.html" data-i18n="nav.reservations">RESERVA</a>
            <a href="contacto.html" data-i18n="nav.contact">CONTACTO</a>
        </div>
    </nav>
</header>

<main class="menu-container">

    <!-- Decoración Hojas Oliva Superior -->
    <div class="leaf-bg leaf-top-right"></div>
    <div class="leaf-bg leaf-mid-left"></div>

    <!-- CONTENEDOR EN REJILLA -->
    <div class="menu-grid">

        <!-- SECCIÓN: ENTRANTES -->
        <section class="menu-section">
            <div class="section-title">
                <h1>MENÚ</h1>
                <h2>Entrantes</h2>
            </div>
            <div class="dish-list" id="entrantes">
                <!-- Se carga dinámicamente desde data.json -->
            </div>
        </section>

        <!-- SECCIÓN: PRINCIPAL -->
        <section class="menu-section">
            <div class="section-title">
                <h2>Principal</h2>
            </div>
            <div class="dish-list" id="principal">
                <!-- Se carga dinámicamente desde data.json -->
            </div>
        </section>

        <!-- SECCIÓN: POSTRES -->
        <section class="menu-section">
            <div class="section-title">
                <h2>Postres</h2>
            </div>
            <div class="dish-list" id="postres">
                <!-- Se carga dinámicamente desde data.json -->
            </div>
        </section>

        <!-- SECCIÓN: BEBIDAS -->
        <section class="menu-section">
            <div class="section-title">
                <h2>Bebidas</h2>
            </div>
            <div class="dish-list" id="bebidas">
                <!-- Se carga dinámicamente desde data.json -->
            </div>
        </section>

    </div> <!-- /menu-grid -->

</main>

</body>
</html>
